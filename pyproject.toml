[project]
name = "art-pipeline"
version = "0.2.0"
description = "Model-neutral MCP toolchain: PSD to Spine 4.2 rigs and animation, After Effects FX, budget QA and game-ready export"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "kumikilongyeyo" }, { name = "Egor Fedorov (original spine-mcp)" }]
keywords = ["art-pipeline", "codex", "mcp", "spine", "spine2d", "animation", "rigging", "gamedev", "slots"]
dependencies = [
  # mcp 2.0 removed mcp.server.fastmcp, which the server is built on.
  "mcp[cli]>=1.2,<2",
  "pydantic>=2.6",
  "numpy>=1.24",
  "scipy>=1.10",
  "pillow>=10",
  "psd-tools>=1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
art-pipeline = "art_pipeline.server:main"
claude-spine = "art_pipeline.server:main"   # compatibility command


[project.urls]
Homepage = "https://github.com/kumikilongyeyo/ART-PIPELINE-MCP"
Upstream = "https://github.com/egorfedorov/spine-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["art_pipeline", "claude_spine"]

[tool.hatch.build.targets.wheel.force-include]
"validator/pose.mjs" = "art_pipeline/_validator/pose.mjs"
"validator/package.json" = "art_pipeline/_validator/package.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
